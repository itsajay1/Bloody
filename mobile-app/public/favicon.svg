<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="dropGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="pinGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </radialGradient>
  </defs>
  <!-- Blood drop shape -->
  <path d="M50 8 C50 8 18 42 18 62 C18 80 32 94 50 94 C68 94 82 80 82 62 C82 42 50 8 50 8 Z"
        fill="url(#dropGrad)"/>
  <!-- Glossy highlight -->
  <ellipse cx="38" cy="42" rx="8" ry="14" fill="white" opacity="0.22" transform="rotate(-20 38 42)"/>
  <!-- Circular search ring -->
  <circle cx="50" cy="65" r="14" fill="none" stroke="white" stroke-width="5" opacity="0.9"/>
  <!-- Pin dot -->
  <circle cx="50" cy="65" r="4" fill="white" opacity="0.95"/>
